# /etc/nginx/sites-available/screenctl-backend.conf
#
# O'rnatish:
#   sudo cp nginx-screenctl-backend.conf /etc/nginx/sites-available/screenctl-backend.conf
#   # api.yourdomain.com o'rniga haqiqiy domeningizni yozing (2 joyda: server_name va comment)
#   sudo ln -s /etc/nginx/sites-available/screenctl-backend.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt) — quyidagi config HTTP (80-port) uchun. Sertifikat
# olib, HTTPS'ga avtomatik ko'chirish uchun shuni ishga tushiring:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.yourdomain.com
# certbot ushbu faylni o'zi tahrirlab, 443-port va SSL sozlamalarini,
# hamda HTTP->HTTPS redirect'ni avtomatik qo'shadi.
#
# MUHIM — WebSocket: Socket.IO ikkala namespace (/clients va /agents)
# ham bitta HTTP endpoint — `/socket.io/` — orqali multiplekslanadi.
# Shu sabab alohida namespace uchun alohida location kerak emas; asosiy
# `location /` bloki `Upgrade`/`Connection` header'larini to'g'ri
# uzatsa, terminal, agent registratsiyasi va job loglari — hammasi ishlaydi.
# Buni to'g'ri qilmaslik ("terminal ulanmayapti" tipidagi xatolarning eng
# keng tarqalgan sababi) — WS handshake oddiy HTTP so'rovga tushib qoladi
# va socket.io "xmlhttprequest poll error" yoki doimiy qayta ulanish bilan
# yakunlanadi.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Backend `express.json({ limit: '256kb' })` bilan cheklaydi —
    # nginx'da ham mos, biroz keng chegara qo'yamiz.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # --- WebSocket upgrade (Socket.IO: /agents va /clients) ---------
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # --- Standart proxy header'lar ------------------------------------
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzoq umr ko'radigan WS ulanishlari (terminal sessiyalari,
        # agent heartbeat) uchun — Socket.IO o'zining ping/pong bilan
        # ulanishni tirik saqlaydi, lekin biz shunga qaramay marja
        # qoldiramiz.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffering'ni o'chiramiz — WS/streaming javoblar darhol
        # yuborilishi kerak, nginx ularni kutib turmasin.
        proxy_buffering off;
    }
}
